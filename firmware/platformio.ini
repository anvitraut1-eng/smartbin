; PlatformIO project: Smart Bin firmware
; Build & upload:  pio run -t upload
; Monitor:         pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
  -D CORE_DEBUG_LEVEL=3

lib_deps =
  tzapu/WiFiManager @ ^2.0.17
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  https://github.com/me-no-dev/AsyncTCP.git
  bblanchon/ArduinoJson @ ^7.1.0

; Run the vibration-algorithm unit test on the native (desktop) platform:
;   pio test -e native -f test_vibration
[env:native]
platform = native
build_flags = -std=c++14 -lgcov
lib_deps =
  bblanchon/ArduinoJson @ ^7.1.0
